<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coldbox browser harness target</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #fixture-visible { min-height: 4rem; padding: 1rem; }
  </style>
</head>
<body>
  <main id="fixture-visible">Visible harness target</main>
  <iframe id="cold-frame" sandbox="allow-scripts" title="Opaque cold frame"></iframe>
  <script>
    (function () {
      var coldDocument = [
        '<!doctype html><html lang="en"><head><meta charset="utf-8">',
        "<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; connect-src 'none'; script-src 'unsafe-inline'\">",
        '<title>Cold fixture</title></head>',
        '<body><p id="cold-ready">Cold frame ready</p><script>',
        'window.__coldboxHarnessFrameReady = true;',
        '<\/script></body></html>'
      ].join('');
      document.getElementById('cold-frame').srcdoc = coldDocument;
    }());
  </script>
</body>
</html>
