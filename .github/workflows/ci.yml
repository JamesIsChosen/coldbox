name: CI

# P0.18 - CI. Implements the pipeline described in docs/05-development/build.md
# and docs/05-development/doc-hygiene.md's "Automated checks" table. See
# docs/05-development/adr/0017-ci-workflow-structure.md for the structural
# decisions behind this file's job layout (why two OSes, why browser tests
# are a separate opt-in job, how attestation is gated).
#
# Every job pins the exact Node version from .nvmrc (never "latest") because
# a different toolchain can legitimately produce different build output -
# see build.md's determinism requirements.
#
# Third-party Actions (checkout/setup-node/upload-artifact/download-artifact/
# attest-build-provenance) are pinned to the newest major each supports as of
# this commit (checkout v7, setup-node v7, upload-artifact v7,
# download-artifact v8, attest-build-provenance v4 - all Node 24-runtime,
# confirmed via each action's GitHub Releases API at the time this was
# written). Action releases move; a reviewer or future maintainer should
# re-check these are still current rather than assuming this comment stays
# accurate forever.
#
# setup-node was bumped v6 -> v7 during P0.18 R2 remediation (see the packet's
# "Remediation of R2 review FAIL" section): v7 migrated the action to ESM and
# removed a NODE_AUTH_TOKEN fallback that only mattered for actions that pass
# that input. This workflow only ever passes node-version-file to
# actions/setup-node, so that removal does not affect it.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]

# Cancel superseded runs on the same ref so PRs pushed twice in a row don't
# queue two full cross-OS build matrices.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Build, verify, lint, and test on two operating systems. Each leg is
  # fully independent (its own npm ci, its own two builds) so that a
  # nondeterminism bug tied to filesystem case-sensitivity, path separators,
  # or locale defaults surfaces here rather than only in a human's hands
  # later. The compare-hashes job below then checks the two OSes agree with
  # each other, on top of each OS agreeing with itself.
  # ---------------------------------------------------------------------
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        # Explicit checkout semantics, not actions/checkout@v4's defaults.
        # Two things the defaults get wrong for this repository's
        # reproducibility contract (see review finding F1 on P0.18):
        #
        # 1. On `pull_request` events, actions/checkout@v4 by default
        #    checks out GitHub's synthetic merge commit (the PR head
        #    merged into the base branch), not the actual PR head SHA.
        #    build.js embeds a build date derived from git history, so
        #    building the synthetic merge commit produces different bytes
        #    than building the real commit a reviewer would check out
        #    locally. `ref` pins to the real head SHA on pull_request
        #    events (falling through to the default ref - the pushed
        #    branch/tag/release commit - on every other event, since
        #    github.event.pull_request is only populated for PRs).
        # 2. The default `fetch-depth: 1` (shallow clone) means
        #    `git log -1 -- src scripts vendor` in build.js may not
        #    resolve to the same commit a full-history local clone would
        #    find, if the most recent commit touching those paths isn't
        #    the tip itself. `fetch-depth: 0` fetches full history,
        #    matching what a plain `git clone` gives a local builder.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js (pinned via .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Confirm pinned Node version
        shell: bash
        run: |
          expected="$(cat .nvmrc)"
          actual="$(node --version)"
          echo "Expected v$expected, got $actual"
          [ "$actual" = "v$expected" ] || { echo "Node version mismatch"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Verify vendored dependencies against upstream
        # The one step that touches the network - re-downloads every
        # vendored release from the real npm registry and compares hashes.
        # This is the check the review protocol calls out by name: "download
        # vendored dependencies from upstream to compare bytes."
        run: npm run verify-vendor

      - name: Forbidden-construct lint
        run: npm run lint

      - name: Documentation hygiene checks
        # Internal link resolution, review dates (missing = FAIL, stale =
        # WARN), help-content depth blocks, doc index consistency, roadmap
        # ID references, and dependencies.md vs vendor-manifest.json - all
        # implemented in scripts/check-docs.js. WARN-severity findings
        # (stale review dates, TODO/TBD in user-facing docs) print but do
        # not fail this step, matching the P0.18 acceptance criterion "an
        # out-of-date review date warns."
        run: npm run check-docs

      - name: Unit and vector tests
        run: npm test

      - name: Build (first pass)
        run: npm run build

      - name: Record first-pass hash
        shell: bash
        run: cp build/coldbox.html.sha256 first-pass.sha256

      - name: Build (second pass, same checkout)
        # P0.18 acceptance: "a nondeterministic change fails CI." Two builds
        # from the identical checked-out source, in the identical job, must
        # produce byte-identical output. build.js overwrites build/ in
        # place, so no directory removal is needed between passes.
        run: npm run build

      - name: Compare double-build hashes
        shell: bash
        run: |
          echo "First pass:"
          cat first-pass.sha256
          echo "Second pass:"
          cat build/coldbox.html.sha256
          diff first-pass.sha256 build/coldbox.html.sha256 || {
            echo "::error::Double-build hash mismatch on ${{ matrix.os }} - the build is not reproducible"
            exit 1
          }
          echo "Double-build hashes match on ${{ matrix.os }}."

      - name: Bundle size report
        shell: bash
        run: |
          bytes=$(wc -c < build/coldbox.html | tr -d ' ')
          kib=$(( bytes / 1024 ))
          {
            echo "### Bundle size (${{ matrix.os }})"
            echo ""
            echo "\`build/coldbox.html\`: ${bytes} bytes (~${kib} KiB)"
            echo ""
            echo "Budget per docs/05-development/dependencies.md: target ≤ 4 MB, hard cap 4.5 MB."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Bundle size: ${bytes} bytes (~${kib} KiB)"

      - name: Upload built artifact and hash
        uses: actions/upload-artifact@v7
        with:
          name: coldbox-build-${{ matrix.os }}
          path: |
            build/coldbox.html
            build/coldbox.html.sha256
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  # Cross-OS reproducibility. Downloads both matrix legs' hash sidecars and
  # confirms they're identical - the "second-OS build comparison" acceptance
  # item. A mismatch here means something OS-specific (path separators,
  # default text encoding, a tool version difference) leaked into the
  # output, which double-build-on-one-OS alone cannot catch.
  # ---------------------------------------------------------------------
  compare-hashes:
    name: Compare build hash across operating systems
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Ubuntu build
        uses: actions/download-artifact@v8
        with:
          name: coldbox-build-ubuntu-latest
          path: ubuntu-build

      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: coldbox-build-windows-latest
          path: windows-build

      - name: Compare
        run: |
          echo "Ubuntu hash:"
          cat ubuntu-build/coldbox.html.sha256
          echo "Windows hash:"
          cat windows-build/coldbox.html.sha256
          ubuntu_digest=$(cut -d ' ' -f1 ubuntu-build/coldbox.html.sha256)
          windows_digest=$(cut -d ' ' -f1 windows-build/coldbox.html.sha256)
          if [ "$ubuntu_digest" != "$windows_digest" ]; then
            echo "::error::Build hash differs between ubuntu-latest and windows-latest - the build is not reproducible across operating systems"
            exit 1
          fi
          echo "Build hash matches across ubuntu-latest and windows-latest: $ubuntu_digest"

  # ---------------------------------------------------------------------
  # Browser (Playwright) verification. GitHub-hosted runners have normal
  # outbound network access, unlike the offline dev sandbox this project's
  # own packets repeatedly note cannot download Playwright's browser
  # binaries - so this job is expected to actually run here, not just be
  # wired up and hoped for. Runs on every push and pull request, same as
  # every other job in this file - not path-filtered, deliberately: a
  # per-job path filter needs either GitHub's workflow-level `on.paths`
  # (which would skip doc-only-looking changes for the *whole* workflow,
  # including doc-hygiene checks that must always run) or a third-party
  # diffing action, and this item does not add a new dependency to solve a
  # cost problem that has not yet been observed. See ADR-0017's "What would
  # change our mind" for the condition under which path-scoping this job
  # becomes worth it, echoing ADR-0007's own note that CI cost was always
  # expected to eventually need this.
  # ---------------------------------------------------------------------
  browser-tests:
    name: Browser harness (Chromium + Firefox)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js (pinned via .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build
        run: npm run build

      - name: Run browser harness
        run: npm run test:browser

  # ---------------------------------------------------------------------
  # Release attestation. Gated to only run on a published GitHub release or
  # a v*-tagged push, per the roadmap item's own note that this needs repo
  # secrets/permissions a human configures - it cannot be verified end to
  # end from this authoring session. See the PR packet's "what to
  # scrutinise" section: this step is implemented per GitHub's documented
  # actions/attest-build-provenance contract, but its actual success has
  # not been observed, because doing so requires a real tag/release push
  # this session cannot make.
  # ---------------------------------------------------------------------
  attestation:
    name: Release build attestation
    needs: build
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        # Same explicit checkout semantics as the build/browser-tests jobs
        # (see the build job's Checkout step comment). This job only ever
        # runs on `release`/tag-push events, so
        # github.event.pull_request.head.sha is always empty here and this
        # falls through to github.sha - kept identical to the other jobs
        # for consistency and so a future trigger change doesn't silently
        # regress this job back to shallow/synthetic checkout semantics.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js (pinned via .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Verify vendored dependencies against upstream
        run: npm run verify-vendor

      - name: Build release artifact
        run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'build/coldbox.html'

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: coldbox-release
          path: |
            build/coldbox.html
            build/coldbox.html.sha256
          if-no-files-found: error
