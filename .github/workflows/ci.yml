name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js (pinned via .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Confirm pinned Node version
        shell: bash
        run: |
          expected="$(cat .nvmrc)"
          actual="$(node --version)"
          echo "Expected v$expected, got $actual"
          [ "$actual" = "v$expected" ] || { echo "Node version mismatch"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Verify vendored dependencies against upstream
        run: npm run verify-vendor

      - name: Forbidden-construct lint
        run: npm run lint

      - name: Documentation hygiene checks
        run: npm run check-docs

      - name: Unit and vector tests
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'test.log'
          & npm test -- --test-reporter=tap *> $log
          $exitCode = $LASTEXITCODE
          Get-Content -LiteralPath $log
          if ($exitCode -ne 0) {
            exit $exitCode
          }
          $skipLine = Get-Content -LiteralPath $log | Where-Object { $_ -match '^# skipped\s+(\d+)' } | Select-Object -First 1
          $skipped = 0
          if ($skipLine -match '^# skipped\s+(\d+)') {
            $skipped = [int]$Matches[1]
          }
          Write-Host "skipped=$skipped"
          if ($skipped -ne 0) {
            Write-Error "$skipped test(s) skipped. CI is a review witness; skips are not passes."
            exit 1
          }

      - name: Build (first pass)
        run: npm run build

      - name: Record first-pass hash
        shell: bash
        run: cp build/coldbox.html.sha256 first-pass.sha256

      - name: Build (second pass, same checkout)
        run: npm run build

      - name: Compare double-build hashes
        shell: bash
        run: |
          echo "First pass:"
          cat first-pass.sha256
          echo "Second pass:"
          cat build/coldbox.html.sha256
          diff first-pass.sha256 build/coldbox.html.sha256 || {
            echo "::error::Double-build hash mismatch on ${{ matrix.os }} - the build is not reproducible"
            exit 1
          }
          echo "Double-build hashes match on ${{ matrix.os }}."

      - name: Bundle size report
        shell: bash
        run: |
          bytes=$(wc -c < build/coldbox.html | tr -d ' ')
          kib=$(( bytes / 1024 ))
          {
            echo "### Bundle size (${{ matrix.os }})"
            echo ""
            echo "\`build/coldbox.html\`: ${bytes} bytes (~${kib} KiB)"
            echo ""
            echo "Budget per docs/05-development/dependencies.md: target ≤ 4 MB, hard cap 4.5 MB."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Bundle size: ${bytes} bytes (~${kib} KiB)"

      - name: Upload built artifact and hash
        uses: actions/upload-artifact@v7
        with:
          name: coldbox-build-${{ matrix.os }}
          path: |
            build/coldbox.html
            build/coldbox.html.sha256
          if-no-files-found: error
          retention-days: 14

  # UI.4a/UI.10a approved references are untrusted prototype evidence. The
  # manifest is the only authoritative inventory. This job derives every file
  # from every set, requires the on-disk *.html.reference set to match exactly,
  # copies only those files to a temporary root, and scans the copies.
  approved-ui-reference-secret-scan:
    name: Approved UI reference secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Scan every manifest-declared approved reference
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/runner/secret-scan.ps1

          $referenceRoot = Join-Path (Get-Location) 'docs/05-development/ui-reference/approved'
          $manifestPath = Join-Path $referenceRoot 'manifest.json'
          $auditRoot = Join-Path $env:RUNNER_TEMP ('coldbox-approved-reference-scan-' + [guid]::NewGuid().ToString('N'))

          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw 'Approved reference manifest is missing'
          }

          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json -Depth 100
          $declared = @(
            foreach ($set in @($manifest.sets)) {
              if (-not $set.references) {
                throw "Reference set '$($set.id)' has no references object"
              }
              foreach ($property in $set.references.PSObject.Properties) {
                $name = [string]$property.Value.file
                if ($name -notmatch '^[a-z0-9-]+\.html\.reference$') {
                  throw "Unsafe or missing approved reference filename in manifest: '$name'"
                }
                $name
              }
            }
          )

          if ($declared.Count -eq 0) {
            throw 'Approved reference manifest declares no reference files'
          }
          $declaredUnique = @($declared | Sort-Object -Unique)
          if ($declaredUnique.Count -ne $declared.Count) {
            throw 'Approved reference manifest declares a reference file more than once'
          }

          $actual = @(
            Get-ChildItem -LiteralPath $referenceRoot -File -Filter '*.html.reference' |
              Select-Object -ExpandProperty Name |
              Sort-Object
          )
          $declaredSorted = @($declared | Sort-Object)
          $directoryDelta = @(Compare-Object -ReferenceObject $declaredSorted -DifferenceObject $actual)
          if ($directoryDelta.Count -ne 0) {
            $directoryDelta | Format-Table | Out-Host
            throw 'Approved reference directory is not exactly the manifest-declared file set; refusing an incomplete scan'
          }

          New-Item -ItemType Directory -Path $auditRoot -Force | Out-Null
          try {
            foreach ($name in $declaredSorted) {
              $source = Join-Path $referenceRoot $name
              $destination = Join-Path $auditRoot $name
              Copy-Item -LiteralPath $source -Destination $destination
              $sourceHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $source).Hash
              $copyHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $destination).Hash
              if ($sourceHash -cne $copyHash) {
                throw "Temporary scan copy changed bytes: $name"
              }
              Write-Host "$name SHA256 $copyHash"
            }

            $auditFiles = @(
              Get-ChildItem -LiteralPath $auditRoot -File |
                Select-Object -ExpandProperty Name |
                Sort-Object
            )
            $auditDelta = @(Compare-Object -ReferenceObject $declaredSorted -DifferenceObject $auditFiles)
            if ($auditDelta.Count -ne 0) {
              throw 'Temporary scan root does not contain exactly the manifest-declared references'
            }

            $scan = Invoke-ColdboxSecretScan -Root $auditRoot -RepoPath (Get-Location).Path
            $scan | Format-List | Out-Host
            if (-not $scan.Clean -or $scan.FindingCount -ne 0 -or $scan.SkippedCount -ne 0) {
              throw "Approved UI reference secret scan failed: findings=$($scan.FindingCount), skipped=$($scan.SkippedCount)"
            }

            $report = Get-Content -Raw -LiteralPath (Join-Path $auditRoot 'scan-report.txt')
            if ($report -notmatch '(?m)^CLEAN - no vault, private-key, or BIP-39 mnemonic-shaped content found in candidate text\.$') {
              throw 'Secret scan report did not contain the clean result'
            }
            if ($report -notmatch '(?m)^SKIPPED-BINARY - 0 files\.$') {
              throw 'Secret scan report did not prove that zero candidate files were skipped'
            }
            Write-Host "Approved UI reference secret scan passed: scanned=$($declaredSorted.Count), findings=0, skipped=0."
          } finally {
            if (Test-Path -LiteralPath $auditRoot) {
              Remove-Item -LiteralPath $auditRoot -Recurse -Force
            }
          }

  compare-hashes:
    name: Compare build hash across operating systems
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Ubuntu build
        uses: actions/download-artifact@v8
        with:
          name: coldbox-build-ubuntu-latest
          path: ubuntu-build

      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: coldbox-build-windows-latest
          path: windows-build

      - name: Compare
        run: |
          echo "Ubuntu hash:"
          cat ubuntu-build/coldbox.html.sha256
          echo "Windows hash:"
          cat windows-build/coldbox.html.sha256
          ubuntu_digest=$(cut -d ' ' -f1 ubuntu-build/coldbox.html.sha256)
          windows_digest=$(cut -d ' ' -f1 windows-build/coldbox.html.sha256)
          if [ "$ubuntu_digest" != "$windows_digest" ]; then
            echo "::error::Build hash differs between ubuntu-latest and windows-latest - the build is not reproducible across operating systems"
            exit 1
          fi
          echo "Build hash matches across ubuntu-latest and windows-latest: $ubuntu_digest"

  browser-tests:
    name: Browser harness (Chromium + Firefox)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js (pinned via .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build
        run: npm run build

      - name: Run browser harness
        run: npm run test:browser

  attestation:
    name: Release build attestation
    needs: build
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js (pinned via .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Verify vendored dependencies against upstream
        run: npm run verify-vendor

      - name: Build release artifact
        run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'build/coldbox.html'

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: coldbox-release
          path: |
            build/coldbox.html
            build/coldbox.html.sha256
          if-no-files-found: error
